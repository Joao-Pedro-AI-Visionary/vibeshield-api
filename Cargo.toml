[package]
name = "vibeshield-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "API do VibeShield: scanner de segurança para código gerado por IA"

[lib]
name = "vibeshield_api"
path = "src/lib.rs"

[[bin]]
name = "vibeshield-api"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "sync"] }
tower-http = { version = "=0.7.1", features = ["cors", "trace", "limit", "timeout"] }
tower = "=0.5.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rayon = "=1.12.0"
ignore = "=0.4.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.29.1", features = ["v4", "serde"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
utoipa = { version = "=6.0.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "=10.0.2", features = ["axum", "vendored"] }
tower_governor = { version = "=0.8.0", default-features = false, features = ["axum"] }
flate2 = "=1.1.11"
tar = "=0.4.46"
regex = "=1.13.1"
futures = "=0.3.34"
dotenvy = "=0.15.7"

[dev-dependencies]
wiremock = "=0.6.5"
